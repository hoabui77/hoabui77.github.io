<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhịp Sống Tích Cực | Sếp Hòa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #333;
            text-align: center;
            padding: 10% 5%;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            max-width: 650px;
            margin: auto;
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.8em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.3em;
            line-height: 1.8;
            color: #555;
        }
        .footer {
            margin-top: 40px;
            font-style: italic;
            color: #888;
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nghệ Thuật & Tư Duy Sống</h1>
        <p>"Mỗi ngày là một tuyệt tác nếu ta biết tô điểm nó bằng sự tử tế, nụ cười và lòng biết ơn. Hãy cùng nhau kiến tạo một cuộc đời rực rỡ và tràn đầy cảm hứng!"</p>
        <div class="footer">- Sếp Hòa Đồng -</div>
    </div>
</body>
</html>
